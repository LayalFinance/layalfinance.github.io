<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layal | PR & Communications</title>
<meta name="description" content="ليال — علاقات عامة واتصال تسويقي. البورتفوليو قريبًا.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--frame:#2b2b2b;--lift:#eceef1;--sunk:#d9dee3;--ink:#2b2b2b;--muted:#596067;--signal:#d7263d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--frame);font-family:"Alexandria",Tahoma,sans-serif;color:var(--ink);padding:clamp(14px,3vw,36px);display:flex;flex-direction:column;min-height:100vh}
.inner{flex:1;background:linear-gradient(180deg,var(--lift),var(--sunk));display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,7vw,96px)}
.k{font-size:clamp(16px,2.2vw,24px);font-weight:600;color:var(--muted);margin:0}
h1{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(64px,13vw,168px);line-height:.95;margin:.15em 0 .2em;letter-spacing:1px;direction:ltr;text-align:right}
h1 span{color:var(--signal)}
.soon{display:inline-block;align-self:flex-start;margin-top:28px;border:1.5px solid var(--ink);border-radius:999px;padding:8px 20px;font-size:15px}
.band{display:flex;align-items:center;gap:14px;color:#fff;padding:18px 4px 0;direction:ltr;font-size:15px;letter-spacing:2px;flex-wrap:wrap}
.band b{font-weight:600;text-transform:uppercase}
.dot{width:11px;height:11px;border-radius:50%;background:var(--signal)}
.band a{color:#fff;text-decoration:none;font-weight:300}
.band .push{margin-inline-start:auto}
.band a:hover{color:var(--signal)}
</style>
</head>
<body>
<main class="inner">
  <p class="k">علاقات عامة · اتصال تسويقي · محتوى</p>
  <h1>LAYAL<span>.</span></h1>
  <span class="soon">البورتفوليو قريبًا</span>
</main>
<footer class="band"><b>Layal | PR • Trader™</b><span class="dot"></span><a class="push" href="https://www.linkedin.com/in/layalalzahrani">LinkedIn</a><a href="https://x.com/LayalFinance">@LayalFinance</a></footer>
</body>
</html>
